<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link
      rel="shortcut icon"
      href="./images/calculate_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="./main.js" defer></script>
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="calculator">
      <div class="input-container">
        <p id="previous" class="previous-output-result vissible">1123</p>
        <input type="text" id="display" class="current-input" />
      </div>
      <div class="display">
        <button id="clear">C</button>
        <button id="divide">/</button>
        <button id="multiply">*</button>
        <button id="subtract">-</button>
        <button id="seven">7</button>
        <button id="eight">8</button>
        <button id="nine">9</button>
        <button id="add" class="tall">+</button>
        <button id="four">4</button>
        <button id="five">5</button>
        <button id="six">6</button>
        <button id="one">1</button>
        <button id="two">2</button>
        <button id="three">3</button>
        <button id="equals" class="tall">=</button>
        <button id="zero" class="wide-zero">0</button>
        <button id="decimal">.</button>
      </div>
    </div>
  </body>
  <footer>
    <p>Created by rutorina1</p>
  </footer>
</html>
